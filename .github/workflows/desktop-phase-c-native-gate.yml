name: Desktop Phase C dual-architecture native gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-phase-c-native-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-gate:
    name: macOS 15 ${{ matrix.architecture }} packaged production gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exact SEA-capable Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Configure architecture-scoped evidence root
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/desktop-phase-c-${{ matrix.architecture }}-native-evidence"
          {
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "TMPDIR=$RUNNER_TEMP"
          } >>"$GITHUB_ENV"

      - name: Install exact repository dependencies
        run: npm ci

      - name: Run exact native package, production, cleanup, and repository gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/desktop/native-gate.sh \
            --architecture "${{ matrix.architecture }}" \
            --expected-commit "$GITHUB_SHA" \
            --evidence-root "$EVIDENCE_ROOT"

      - name: Assert upload contains only redacted evidence
        id: evidence-redaction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_ROOT"
          if find "$EVIDENCE_ROOT" -type f \( \
            -name 'video.mp4' -o \
            -name 'cover-4x3.png' -o \
            -name 'cover-3x4.png' \
          \) -print -quit | grep -q .; then
            echo "desktop-native-delivery-media-leaked-into-evidence" >&2
            exit 1
          fi
          if find "$EVIDENCE_ROOT" -type f -iname '*token*' \
            -print -quit | grep -q .; then
            echo "desktop-native-token-file-leaked-into-evidence" >&2
            exit 1
          fi
          if find "$EVIDENCE_ROOT" -type f ! -name '*.png' -print0 | \
            xargs -0 grep -El \
              'Bearer [A-Fa-f0-9]{32,}|visible-editable-token|voice_profile'; then
            echo "desktop-native-evidence-redaction-failed" >&2
            exit 1
          fi
          if grep -R -F "$GITHUB_WORKSPACE" "$EVIDENCE_ROOT"; then
            echo "desktop-native-repository-path-leaked-into-evidence" >&2
            exit 1
          fi

      - name: Upload redacted native evidence
        if: ${{ always() && steps.evidence-redaction.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-phase-c-${{ matrix.architecture }}-native-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
