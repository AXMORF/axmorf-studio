name: macOS npm Workspace gate

on:
  workflow_dispatch:
  push:
    branches:
      - axmorf/npm-workspace-open-source

permissions:
  contents: read

concurrency:
  group: macos-npm-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS 15 arm64 package and scaffold
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Verify native host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.platform')" = "darwin"
          test "$(node -p 'process.arch')" = "arm64"
          node --version
          npm --version

      - name: Install exact repository dependencies
        run: npm ci

      - name: Run repository and public package gates
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:typecheck
          npm run packages:build
          npm run check

      - name: Pack public packages and record checksums
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/axmorf-studio-macos-release"
          mkdir -p "$release_root"
          npm pack ./packages/studio --pack-destination "$release_root" | \
            tee "$release_root/runtime-pack.log"
          npm pack ./packages/create-axmorf-studio --pack-destination "$release_root" | \
            tee "$release_root/creator-pack.log"
          runtime_name="$(tail -n 1 "$release_root/runtime-pack.log")"
          creator_name="$(tail -n 1 "$release_root/creator-pack.log")"
          runtime_tarball="$release_root/$runtime_name"
          creator_tarball="$release_root/$creator_name"
          test -f "$runtime_tarball"
          test -f "$creator_tarball"
          shasum -a 256 "$runtime_tarball" "$creator_tarball" >"$release_root/SHA256SUMS"
          npm audit --json >"$release_root/repository-audit.json"
          {
            echo "RELEASE_ROOT=$release_root"
            echo "RUNTIME_TARBALL=$runtime_tarball"
            echo "CREATOR_TARBALL=$creator_tarball"
          } >>"$GITHUB_ENV"

      - name: Create and validate a fresh external Workspace
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/axmorf-studio-macos-smoke"
          mkdir -p "$smoke_root"
          cd "$smoke_root"
          npm exec --yes --package="$CREATOR_TARBALL" -- \
            create-axmorf-studio my-video \
            --yes \
            --runtime-package "$RUNTIME_TARBALL"
          cd my-video
          test -x node_modules/.bin/axmorf
          ./node_modules/.bin/axmorf doctor | tee "$RELEASE_ROOT/workspace-doctor.json"
          npm run compositions | tee "$RELEASE_ROOT/workspace-compositions.txt"
          npm audit --omit=dev --json >"$RELEASE_ROOT/workspace-audit.json"
          npm ls remotion @remotion/cli --json >"$RELEASE_ROOT/workspace-remotion-versions.json"
          cp package-lock.json "$RELEASE_ROOT/workspace-package-lock.json"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "uname=$(uname -s) $(uname -m)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } >"$RELEASE_ROOT/host-receipt.txt"

      - name: Publish validation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## macOS npm Workspace gate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Host: \`$(uname -s) $(uname -m)\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- npm publish: not executed"
            echo
            echo '```text'
            cat "$RELEASE_ROOT/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload macOS validation receipt
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-npm-workspace-${{ github.run_id }}
          path: ${{ env.RELEASE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
