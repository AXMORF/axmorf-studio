name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Type the exact release tag, for example v0.1.0
        required: true
        type: string
      reuse_reviewed_acceptance:
        description: Optional exact tag approving the plan's documented prior acceptance reuse
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      AXMORF_RELEASE_NATIVE_REUSE_TAG: ${{ inputs.reuse_reviewed_acceptance }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install exact Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag and package versions
        shell: bash
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          root_version="$(node -p 'require("./package.json").version')"
          runtime_version="$(node -p 'require("./packages/studio/package.json").version')"
          creator_version="$(node -p 'require("./packages/create-axmorf-studio/package.json").version')"
          test "$runtime_version" = "$root_version"
          test "$creator_version" = "$root_version"
          test "$GITHUB_REF_NAME" = "v$root_version"
          test "$CONFIRM_VERSION" = "$GITHUB_REF_NAME"
          test -f "docs/evidence/v${root_version}-release-plan.json"

      - name: Install exact dependencies
        run: npm ci

      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Resolve reviewed release scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          node --import tsx scripts/release/release-gate.ts inspect "docs/evidence/v${version}-release-plan.json" >"$RUNNER_TEMP/release-scope.json"
          echo "native_first_use=$(node -p 'require(process.argv[1]).freshNativeFirstUse' "$RUNNER_TEMP/release-scope.json")" >>"$GITHUB_OUTPUT"

      - name: Run package gates and scoped regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run packages:typecheck
          npm run packages:build
          version="$(node -p 'require("./package.json").version')"
          node --import tsx scripts/release/release-gate.ts regressions "docs/evidence/v${version}-release-plan.json"
          npm audit --audit-level=low

      - name: Run complete repository gates for major scope
        if: steps.scope.outputs.native_first_use == 'true'
        run: npm run check

      - name: Run ordinary release source and build gates
        if: steps.scope.outputs.native_first_use != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run docs:check-links
          npm run scene-template-audio:check
          npm run catalog:check
          npm run registry:check
          npm run config:build
          npm run build
          npm run check:host

      - name: Render and decode minimal runtime evidence
        shell: bash
        env:
          RUNTIME_RENDER_PATH: ${{ runner.temp }}/runtime-proof.mp4
          RUNTIME_RENDER_FACTS: ${{ runner.temp }}/runtime-proof-facts.json
          RUNTIME_RENDER_RECEIPT: ${{ runner.temp }}/runtime-render-evidence.json
        run: |
          set -euo pipefail
          npm exec -- remotion render src/index.ts DefaultIntroPreview "$RUNTIME_RENDER_PATH" --codec=h264 --audio-codec=aac --log=error
          ffmpeg -v error -i "$RUNTIME_RENDER_PATH" -f null -
          ffprobe -v error -count_frames -show_streams -of json "$RUNTIME_RENDER_PATH" >"$RUNTIME_RENDER_FACTS"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const {streams}=JSON.parse(readFileSync(process.env.RUNTIME_RENDER_FACTS,'utf8'));
          const video=streams.filter(stream=>stream.codec_type==='video');
          const audio=streams.filter(stream=>stream.codec_type==='audio');
          assert.equal(video.length,1); assert.equal(audio.length,1);
          assert.equal(video[0].codec_name,'h264'); assert.equal(audio[0].codec_name,'aac');
          assert.equal(video[0].width,1080); assert.equal(video[0].height,1920);
          assert.equal(video[0].r_frame_rate,'30/1'); assert.equal(video[0].nb_read_frames,'60');
          assert.equal(audio[0].channels,2);
          const checksum='sha256:'+createHash('sha256').update(readFileSync(process.env.RUNTIME_RENDER_PATH)).digest('hex');
          writeFileSync(process.env.RUNTIME_RENDER_RECEIPT,JSON.stringify({schemaVersion:1,status:'pass',compositionId:'DefaultIntroPreview',checksum,width:1080,height:1920,fps:30,durationInFrames:60,audioCodec:'aac',audioChannels:2,eofDecode:true})+'\n');
          JS

      - name: Pack exact release candidates
        id: pack
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/axmorf-npm-release
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ROOT"
          npm pack ./packages/studio --ignore-scripts --pack-destination "$RELEASE_ROOT" --json >"$RELEASE_ROOT/runtime-pack.json"
          npm pack ./packages/create-axmorf-studio --ignore-scripts --pack-destination "$RELEASE_ROOT" --json >"$RELEASE_ROOT/creator-pack.json"

          runtime_file="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$RELEASE_ROOT/runtime-pack.json")"
          creator_file="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$RELEASE_ROOT/creator-pack.json")"
          runtime_integrity="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].integrity' "$RELEASE_ROOT/runtime-pack.json")"
          creator_integrity="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].integrity' "$RELEASE_ROOT/creator-pack.json")"

          test -f "$RELEASE_ROOT/$runtime_file"
          test -f "$RELEASE_ROOT/$creator_file"
          (
            cd "$RELEASE_ROOT"
            sha256sum "$runtime_file" "$creator_file" >SHA256SUMS
          )

          {
            echo "runtime_tarball=$RELEASE_ROOT/$runtime_file"
            echo "creator_tarball=$RELEASE_ROOT/$creator_file"
            echo "runtime_integrity=$runtime_integrity"
            echo "creator_integrity=$creator_integrity"
          } >>"$GITHUB_OUTPUT"

      - name: Create and validate a fresh external Workspace
        shell: bash
        env:
          RUNTIME_TARBALL: ${{ steps.pack.outputs.runtime_tarball }}
          CREATOR_TARBALL: ${{ steps.pack.outputs.creator_tarball }}
          RELEASE_ROOT: ${{ runner.temp }}/axmorf-npm-release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/axmorf-npm-smoke"
          cd "$RUNNER_TEMP/axmorf-npm-smoke"
          npm exec --yes --package="$CREATOR_TARBALL" -- create-axmorf-studio workspace --yes --runtime-package "$RUNTIME_TARBALL"
          cd workspace
          ./node_modules/.bin/axmorf doctor | tee "$RELEASE_ROOT/workspace-doctor.json"
          npm run compositions | tee "$RELEASE_ROOT/workspace-compositions.txt"
          npm ls remotion @remotion/cli --json >"$RELEASE_ROOT/workspace-remotion-versions.json"
          cp package-lock.json "$RELEASE_ROOT/workspace-package-lock.json"

      - name: Verify scoped release evidence against exact candidates
        shell: bash
        env:
          RUNTIME_TARBALL: ${{ steps.pack.outputs.runtime_tarball }}
          CREATOR_TARBALL: ${{ steps.pack.outputs.creator_tarball }}
          RELEASE_ROOT: ${{ runner.temp }}/axmorf-npm-release
          NATIVE_FIRST_USE: ${{ steps.scope.outputs.native_first_use }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          plan="docs/evidence/v${version}-release-plan.json"
          evidence=()
          if [[ "$NATIVE_FIRST_USE" == "true" ]]; then
            receipt="docs/evidence/v${version}-first-use.json"
            test -f "$receipt"
            evidence=("$receipt")
            cp "$receipt" "$RELEASE_ROOT/first-use.json"
          fi
          node --import tsx scripts/release/release-gate.ts verify "$plan" "$RUNTIME_TARBALL" "$CREATOR_TARBALL" "${evidence[@]}" | tee "$RELEASE_ROOT/release-verification.json"
          cp "$plan" "$RELEASE_ROOT/release-plan.json"
          cp "$RUNNER_TEMP/release-scope.json" "$RELEASE_ROOT/release-scope.json"
          cp "$RUNNER_TEMP/runtime-render-evidence.json" "$RELEASE_ROOT/runtime-render-evidence.json"

      - name: Publish or verify exact package versions
        shell: bash
        env:
          RUNTIME_TARBALL: ${{ steps.pack.outputs.runtime_tarball }}
          CREATOR_TARBALL: ${{ steps.pack.outputs.creator_tarball }}
          RUNTIME_INTEGRITY: ${{ steps.pack.outputs.runtime_integrity }}
          CREATOR_INTEGRITY: ${{ steps.pack.outputs.creator_integrity }}
        run: |
          set -euo pipefail

          publish_or_verify() {
            package_name="$1"
            package_version="$2"
            tarball="$3"
            local_integrity="$4"
            registry_integrity="$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null || true)"

            if [[ -n "$registry_integrity" ]]; then
              test "$registry_integrity" = "$local_integrity"
              echo "$package_name@$package_version already exists with the exact expected integrity."
              return
            fi

            npm publish "$tarball" --access public --provenance
            registry_integrity=""
            for attempt in {1..30}; do
              registry_integrity="$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null || true)"
              if [[ -n "$registry_integrity" ]]; then
                break
              fi
              if (( attempt < 30 )); then
                echo "Waiting for $package_name@$package_version to become visible in the public registry ($attempt/30)."
                sleep 10
              fi
            done
            test "$registry_integrity" = "$local_integrity"
          }

          version="$(node -p 'require("./package.json").version')"
          publish_or_verify "@axmorf/studio" "$version" "$RUNTIME_TARBALL" "$RUNTIME_INTEGRITY"
          publish_or_verify "create-axmorf-studio" "$version" "$CREATOR_TARBALL" "$CREATOR_INTEGRITY"

      - name: Publish release summary
        if: always()
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/axmorf-npm-release
        run: |
          {
            echo "## npm release"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            if [[ -f "$RELEASE_ROOT/SHA256SUMS" ]]; then
              echo
              echo '```text'
              cat "$RELEASE_ROOT/SHA256SUMS"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload exact release receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-release-${{ github.run_id }}
          path: ${{ runner.temp }}/axmorf-npm-release
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
